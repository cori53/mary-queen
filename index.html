<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6f249c">
<meta name="application-name" content="MARY Queen">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>MARY – Queen Edition</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand" id="brandHome">
      <img src="mary-logo.png" alt="MARY Queen logo">
      <div>
        <div class="brand-title">MARY <span>Queen Edition</span></div>
        <div class="brand-sub">La tua vita, la tua forza.</div>
      </div>
    </div>
    <button class="round-btn" id="themeBtn" aria-label="Tema">◐</button>
  </header>

  <main id="view"></main>

  <nav class="bottom-nav">
    <button class="nav active" data-view="home"><b>⌂</b><span data-t="home">Home</span></button>
    <button class="nav" data-view="areas"><b>♛</b><span data-t="areas">Aree</span></button>
    <button class="nav" data-view="nearby"><b>⌖</b><span data-t="nearby">Vicino</span></button>
    <button class="nav" data-view="agenda"><b>▣</b><span data-t="agenda">Agenda</span></button>
    <button class="nav" data-view="profile"><b>⚙</b><span data-t="profile">Profilo</span></button>
  </nav>
</div>

<div class="sheet hidden" id="sheet">
  <div class="sheet-card">
    <div class="sheet-handle"></div>
    <button class="sheet-close" id="sheetClose">×</button>
    <div id="sheetContent"></div>
  </div>
</div>

<div id="toast" class="toast">Salvato</div>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./service-worker.js', {updateViaCache: 'none'});
      await reg.update();
    } catch (e) {
      console.warn('MARY service worker:', e);
    }
  });
}
</script>
</body>
</html>
