function clone(x){return JSON.parse(JSON.stringify(x))}
function deepMerge(a,b){
  if(!b||typeof b!=='object') return a;
  for(const k of Object.keys(b)){
    if(b[k] && typeof b[k]==='object' && !Array.isArray(b[k]) && a[k] && typeof a[k]==='object') deepMerge(a[k],b[k]);
    else a[k]=b[k];
  }
  return a;
}
let S=(()=>{try{return deepMerge(clone(DEFAULT),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return clone(DEFAULT)}})();
let currentView='home', activeGroup='Tutte';

const I18N={
it:{home:'Home',areas:'Aree',nearby:'Vicino',agenda:'Agenda',profile:'Profilo',hello:'Ciao',today:'La tua giornata',areasTitle:'Le aree di MARY',all:'Tutte'},

};

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1300)}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function euro(v){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(v)||0)}
function id(){return Date.now()+Math.floor(Math.random()*999)}
function todayISO(){return new Date().toISOString().slice(0,10)}
function imgSrc(m){return m.img==='shopping'?'shopping.jpg':`screen-${String(m.img).padStart(2,'0')}.jpg`}
function addXP(n=5){S.xp+=n}
function del(list,uid){S.logs[list]=S.logs[list].filter(x=>x.id!==uid);save()}
function setField(path,value){
  const parts=path.split('.'); let o=S; for(let i=0;i<parts.length-1;i++)o=o[parts[i]]; o[parts.at(-1)]=value; localStorage.setItem(KEY,JSON.stringify(S));

function render(){
  document.body.classList.toggle('dark',S.settings.dark);
  $$('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===currentView));

 case 'motivation': return `<div class="quote-big">“${esc(quote())}”</div><div class="card"><h3>💎 Sfida di oggi</h3><p>${esc(challenge())}</p><button class="btn gold full" onclick="completeChallenge()">Segna completata</button></div>`;
 case 'sos': return `<div class="card"><h3>🛡️ SOS & Supporto</h3><p><b>In Italia:</b> 112 per emergenze. 1522 per antiviolenza e stalking.</p><div class="row"><a class="btn" href="tel:112">Chiama 112</a><a class="btn alt" href="tel:1522">Chiama 1522</a></div><label class="label">Contatto personale</label><input id="sosName" value="${esc(S.sos.contact)}" placeholder="Nome"><input id="sosPhone" value="${esc(S.sos.phone)}" placeholder="Telefono" style="margin-top:7px"><button class="btn full" style="margin-top:8px" onclick="saveSOS()">Salva contatto</button></div>`;
 case 'magazine': return `<div class="card"><h3>📰 Magazine MARY</h3><div class="list"><div class="list-item"><strong>Routine serale semplice</strong><small>Prepara domani, abbassa le luci, scegli un’attività rilassante.</small></div><div class="list-item"><strong>Organizzare una visita</strong><small>Salva domande, esami precedenti e promemoria in Salute Donna.</small></div><div class="list-item"><strong>CV: il profilo professionale</strong><small>Scrivi 3–4 righe su esperienza, punti di forza e obiettivo.</small></div></div></div>`;
 case 'language': return `<div class="card"><h3>🌍 Lingua</h3><select onchange="changeLang(this.value)"><option value="it" ${S.profile.language==='it'?'selected':''}>🇮🇹 Italiano</option><option value="ro" ${S.profile.language==='ro'?'selected':''}>🇷🇴 Română</option><option value="en" ${S.profile.language==='en'?'selected':''}>🇬🇧 English</option></select><p>La navigazione principale e le etichette essenziali cambiano lingua; alcuni contenuti specialistici restano in italiano in questa versione.</p></div>`;
 case 'onboarding': return `<div class="card"><h3>💎 Configura MARY</h3><p>Completa nome, città e lingua per personalizzare la tua esperienza.</p><button class="btn full" onclick="closeSheet();goto('profile')">Vai al profilo</button></div>`;
 case 'shopping': return `<div class="card"><h3>🛍️ Shopping Donna</h3><div class="filters"><span class="chip active">Moda</span><span class="chip">Beauty</span><span class="chip">Corpo</span><span class="chip">Regali</span></div><input id="shopName" placeholder="Articolo / idea"><div class="row" style="margin-top:7px"><input id="shopPrice" type="number" step=".01" placeholder="Budget €"><select id="shopCat"><option>Moda</option><option>Beauty</option><option>Cura corpo</option><option>Regalo</option></select></div><button class="btn full" style="margin-top:8px" onclick="addShopping()">Aggiungi wishlist</button><div class="list">${renderList('shopping',x=>`<strong>${esc(x.name)} · ${euro(x.price)}</strong><small>${esc(x.cat)}</small>`)}</div></div>`;
 case 'babysitter': case 'cleaning': return `<div class="card"><h3>${mid==='babysitter'?'🧸 Babysitter':'🧹 Pulizie & Casa'}</h3><input id="svcPerson" placeholder="Nome / contatto"><input id="svcPhone" placeholder="Telefono" style="margin-top:7px"><textarea id="svcNotes" placeholder="Disponibilità, tariffa, note..." style="margin-top:7px"></textarea><button class="btn full" onclick="addExtraService('${mid}')">Salva contatto</button></div>`+genericNotes(mid);
 case 'pediatrician': return `<div class="card"><h3>👶 Crescita Baby</h3><input id="babyName" value="${esc(S.health.babyName)}" placeholder="Nome baby"><input id="pedName" value="${esc(S.health.pediatrician)}" placeholder="Pediatra" style="margin-top:7px"><div class="row" style="margin-top:7px"><input id="babyWeight" value="${esc(S.health.babyWeight)}" type="number" step=".01" placeholder="Peso kg"><input id="babyHeight" value="${esc(S.health.babyHeight)}" type="number" step=".1" placeholder="Altezza cm"></div><button class="btn full" style="margin-top:8px" onclick="saveBaby()">Salva</button></div>`+genericNotes(mid,'Diario Baby');
 case 'gynecologist': return `<div class="card"><h3>🩺 Ginecologo</h3><input id="gynName" value="${esc(S.health.gynName)}" placeholder="Nome ginecologo"><input id="gynPhone" value="${esc(S.health.gynPhone)}" placeholder="Telefono" style="margin-top:7px"><textarea id="gynNotes" placeholder="Esami, controlli, domande..." style="margin-top:7px">${esc(S.health.gynNotes)}</textarea><button class="btn full" onclick="saveGyn()">Salva</button></div>`+genericNotes(mid);
 case 'wallet': return `<div class="card"><h3>💰 Wallet Premium</h3><div class="kpi"><span>Saldo registrato</span><b>${euro(S.logs.money.reduce((a,x)=>a+(x.type==='Entrata'?x.amount:-x.amount),0))}</b></div><div class="row"><select id="moneyType"><option>Spesa</option><option>Entrata</option></select><input id="moneyAmount" type="number" step=".01" placeholder="€"></div><input id="moneyNote" placeholder="Descrizione" style="margin-top:7px"><button class="btn full" style="margin-top:8px" onclick="addMoney()">Registra</button><div class="list">${renderList('money',x=>`<strong>${esc(x.type)} · ${euro(x.amount)}</strong><small>${esc(x.note)} · ${esc(x.date)}</small>`)}</div></div>`;
 case 'meds': return `<div class="card"><h3>💊 Farmaci</h3><div class="row"><input id="medName" placeholder="Farmaco"><input id="medDose" placeholder="Dose/orario"></div><button class="btn full" style="margin-top:8px" onclick="addMed()">Aggiungi</button><div class="list">${renderList('meds',x=>`<strong>${esc(x.name)}</strong><small>${esc(x.dose)}</small>`)}</div></div><div class="card"><h3>🩺 Visite</h3><div class="row"><input id="visitName" placeholder="Visita"><input id="visitDate" type="date"></div><button class="btn full" style="margin-top:8px" onclick="addVisit()">Aggiungi</button><div class="list">${renderList('visits',x=>`<strong>${esc(x.name)}</strong><small>${esc(x.date)}</small>`)}</div></div>`;
 case 'family': return `<div class="card"><h3>🏡 Casa & Famiglia</h3><div class="row"><input id="homeTask" placeholder="Nuovo compito"><button class="btn auto" onclick="addHomeTask()">＋</button></div><div class="list">${S.logs.homeTasks.map(x=>`<div class="list-item"><strong>${x.done?'✅':'⬜'} ${esc(x.text)}</strong><div class="actions"><button class="mini" onclick="toggleHomeTask(${x.id})">Fatto</button><button class="mini" onclick="del('homeTasks',${x.id})">Rimuovi</button></div></div>`).join('')}</div></div>`;
 default:return genericNotes(mid);
 }
}
function renderList(list,renderer){const a=S.logs[list]||[];return a.length?a.slice(0,20).map(x=>`<div class="list-item">${renderer(x)}<div class="actions"><button class="mini" onclick="del('${list}',${x.id})">Rimuovi</button></div></div>`).join(''):'<div class="empty">Nessun elemento salvato.</div>'}

function water(d){S.today.water=Math.max(0,Math.min(12,S.today.water+d));if(d>0)addXP(1);save()}
function updateSteps(v){S.today.steps=Number(v)||0;save()}
function updateSleep(v){S.today.sleep=Number(v);save()}
function updateMood(v){S.today.mood=v;save()}
function completeChallenge(){addXP(10);save('Brava Queen! +10 XP')}
function saveProfile(){S.profile.name=$('#pName').value.trim();S.profile.email=$('#pEmail').value.trim();S.profile.phone=$('#pPhone').value.trim();S.profile.city=$('#pCity').value.trim();save()}
function saveModuleProfile(){S.profile.name=$('#mName').value.trim();S.profile.email=$('#mEmail').value.trim();S.profile.phone=$('#mPhone').value.trim();addXP(2);save();openModule('login')}
function changeLang(v){S.profile.language=v;save()}
function toggleTheme(){S.settings.dark=!S.settings.dark;save();openModule('settings')}
function saveHealth(){S.health.cycleDate=$('#cycleDate').value;S.health.cycleLen=Number($('#cycleLen').value)||28;S.health.symptoms=$('#symptoms').value;addXP(3);save();openModule('health')}
function cycleInfo(){if(!S.health.cycleDate)return '<p>Inserisci l’ultimo ciclo per avere una stima indicativa.</p>';const d=new Date(S.health.cycleDate+'T12:00:00');d.setDate(d.getDate()+Number(S.health.cycleLen||28));return `<p>Prossimo ciclo stimato: <b>${d.toLocaleDateString()}</b>. È solo una stima personale, non una previsione medica.</p>`}
function savePregnancy(){S.health.pregnancyStart=$('#pregStart').value;S.health.dueDate=$('#dueDate').value;save();openModule('pregnancy')}
function pregnancyInfo(){if(!S.health.pregnancyStart)return '<p>Inserisci una data per calcolare una settimana indicativa.</p>';const days=Math.floor((Date.now()-new Date(S.health.pregnancyStart+'T12:00:00'))/86400000);const wk=Math.max(0,Math.floor(days/7));return `<p>Settimana indicativa: <b>${wk}</b>. Per datazione e controlli usa sempre le indicazioni del professionista.</p>`}
function saveMenopause(){S.health.meno=$('#menoNotes').value;save();openModule('menopause')}
function saveMental(){S.health.mood=$('#mentalMood').value;S.health.stress=Number($('#stress').value);S.today.mood=S.health.mood;save();openModule('mental')}
function addDiary(kind){const e=$('#diaryEntry');if(!e.value.trim())return;const list=kind==='gratitude'?'gratitude':'diary';S.logs[list].unshift({id:id(),date:new Date().toLocaleString(),text:e.value.trim()});addXP(3);save();openModule(kind)}
function saveNutrition(){S.health.weight=$('#w').value;S.health.weightGoal=$('#wg').value;S.health.nutritionist=$('#nutriName').value;S.health.nutritionNotes=$('#nutriNotes').value;save();openModule('nutrition')}
function addMeal(){if(!$('#mealName').value.trim())return;S.logs.meals.unshift({id:id(),name:$('#mealName').value.trim(),note:$('#mealNote').value.trim(),date:todayISO()});addXP(2);save();openModule('nutrition')}
function addRecipe(){if(!$('#recipeName').value.trim())return;S.logs.recipes.unshift({id:id(),name:$('#recipeName').value.trim(),text:$('#recipeIngredients').value.trim()});addXP(3);save();openModule('recipes')}
function addWorkout(){S.logs.workouts.unshift({id:id(),type:$('#workType').value,min:Number($('#workMin').value)||0,date:todayISO()});addXP(5);save();openModule('fitness')}
function addBeauty(){if(!$('#beautyTitle').value.trim())return;S.logs.beauty.unshift({id:id(),title:$('#beautyTitle').value.trim(),text:$('#beautyText').value.trim()});addXP(2);save();openModule('beauty')}
function addAppointment(kind){if(!$('#apptName').value.trim())return;S.logs.appointments.unshift({id:id(),kind,name:$('#apptName').value.trim(),date:$('#apptDate').value,time:$('#apptTime').value,note:$('#apptNote').value.trim()});save();openModule(kind)}
function addJob(){if(!$('#jobRole').value.trim())return;S.logs.jobs.unshift({id:id(),role:$('#jobRole').value.trim(),company:$('#jobCompany').value.trim(),status:$('#jobStatus').value});addXP(3);save();openModule('jobs')}
function saveCV(){S.cv={name:$('#cvName').value,email:$('#cvEmail').value,phone:$('#cvPhone').value,profile:$('#cvProfile').value,experience:$('#cvExperience').value,education:$('#cvEducation').value,skills:$('#cvSkills').value,languages:$('#cvLanguages').value};addXP(5);save();openModule('cv')}
function exportCV(){saveCV();const c=S.cv;const txt=`${c.name}
${c.email} | ${c.phone}

PROFILO
${c.profile}

ESPERIENZA
${c.experience}

FORMAZIONE
${c.education}

COMPETENZE
${c.skills}

LINGUE
${c.languages}`;download('MARY_CV.txt',txt,'text/plain')}
function addService(){if(!$('#srvName').value.trim())return;S.logs.services.unshift({id:id(),cat:$('#srvCat').value,name:$('#srvName').value.trim(),phone:$('#srvPhone').value.trim()});save();openModule('nearby')}
function addEvent(){if(!$('#eventTitle').value.trim()||!$('#eventDate').value)return;S.logs.events.unshift({id:id(),title:$('#eventTitle').value.trim(),date:$('#eventDate').value,time:$('#eventTime').value,cat:$('#eventCat').value});addXP(2);save();closeSheet();goto('agenda')}
async function askNotifications(){if(!('Notification'in window)){toast('Notifiche non supportate');return}const p=await Notification.requestPermission();toast('Notifiche: '+p);if(p==='granted')new Notification('MARY Queen',{body:'Notifiche attivate 👑',icon:'icon-192.png'})}
function saveSOS(){S.sos.contact=$('#sosName').value;S.sos.phone=$('#sosPhone').value;save();openModule('sos')}
function addShopping(){if(!$('#shopName').value.trim())return;S.logs.shopping.unshift({id:id(),name:$('#shopName').value.trim(),price:Number($('#shopPrice').value)||0,cat:$('#shopCat').value});addXP(2);save();openModule('shopping')}
function addExtraService(kind){if(!$('#svcPerson').value.trim())return;S.logs.services.unshift({id:id(),cat:kind==='babysitter'?'Babysitter':'Pulizie casa',name:$('#svcPerson').value.trim(),phone:$('#svcPhone').value.trim(),notes:$('#svcNotes').value.trim()});save();openModule(kind)}
function saveBaby(){S.health.babyName=$('#babyName').value;S.health.pediatrician=$('#pedName').value;S.health.babyWeight=$('#babyWeight').value;S.health.babyHeight=$('#babyHeight').value;save();openModule('pediatrician')}
function saveGyn(){S.health.gynName=$('#gynName').value;S.health.gynPhone=$('#gynPhone').value;S.health.gynNotes=$('#gynNotes').value;save();openModule('gynecologist')}
function addMoney(){const amount=Number($('#moneyAmount').value)||0;if(!amount)return;S.logs.money.unshift({id:id(),type:$('#moneyType').value,amount,note:$('#moneyNote').value.trim(),date:todayISO()});save();openModule('wallet')}
function addMed(){if(!$('#medName').value.trim())return;S.logs.meds.unshift({id:id(),name:$('#medName').value.trim(),dose:$('#medDose').value.trim()});save();openModule('meds')}
function addVisit(){if(!$('#visitName').value.trim())return;S.logs.visits.unshift({id:id(),name:$('#visitName').value.trim(),date:$('#visitDate').value});save();openModule('meds')}
function addHomeTask(){if(!$('#homeTask').value.trim())return;S.logs.homeTasks.unshift({id:id(),text:$('#homeTask').value.trim(),done:false});save();openModule('family')}
function toggleHomeTask(uid){const x=S.logs.homeTasks.find(a=>a.id===uid);if(x){x.done=!x.done;if(x.done)addXP(2)}save();openModule('family')}

function exportBackup(){download('MARY_Queen_Backup.json',JSON.stringify(S,null,2),'application/json')}
function importBackup(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{S=deepMerge(clone(DEFAULT),JSON.parse(r.result));save('Backup importato')}catch(e){toast('Backup non valido')}};r.readAsText(file)}
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function shareApp(){if(navigator.share){try{await navigator.share({title:'MARY – Queen Edition',text:'MARY Queen',url:location.href})}catch(e){}}else{navigator.clipboard?.writeText(location.href);toast('Link copiato')}}
function resetData(){if(confirm('Cancellare tutti i dati MARY salvati su questo dispositivo?')){localStorage.removeItem(KEY);S=clone(DEFAULT);save('Dati azzerati')}}

$$('.nav').forEach(n=>n.addEventListener('click',()=>goto(n.dataset.view)));
$('#sheetClose').addEventListener('click',closeSheet);
$('#sheet').addEventListener('click',e=>{if(e.target===$('#sheet'))closeSheet()});
$('#themeBtn').addEventListener('click',()=>{S.settings.dark=!S.settings.dark;save()});
$('#brandHome').addEventListener('click',()=>goto('home'));
render();

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./service-worker.js', {updateViaCache:'none'});
      await reg.update();
    } catch (e) {
      console.warn('MARY service worker:', e);
    }
  });
}
</script>
</body>
</html>
